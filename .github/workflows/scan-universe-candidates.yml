name: Scan full A-share candidate universe

on:
  push:
    branches: [main]
    paths:
      - "dashboard/data/scan-request.txt"
  workflow_dispatch:
    inputs:
      trade_date:
        description: "Trade date. Leave empty to use the latest weekday."
        required: false
        type: string
  schedule:
    # 08:00 UTC = 16:00 Asia/Shanghai on trading weekdays.
    - cron: "0 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: universe-candidate-scan
  cancel-in-progress: true

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Scan shard
        env:
          INPUT_TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          TRADE_DATE="${INPUT_TRADE_DATE:-$(python dashboard/scripts/resolve_trade_date.py)}"
          python dashboard/scripts/scan_universe_candidates.py \
            --date "$TRADE_DATE" \
            --out "universe-shard-${{ matrix.shard }}.json" \
            --daily "/tmp/no-daily.json" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 6 \
            --workers 8 \
            --timeout 8 \
            --retries 1
      - uses: actions/upload-artifact@v4
        with:
          name: universe-shard-${{ matrix.shard }}
          path: universe-shard-${{ matrix.shard }}.json
          retention-days: 1

  merge:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: universe-shard-*
          path: universe-shards
      - name: Merge candidate universe
        run: |
          python dashboard/scripts/merge_universe_candidates.py \
            --input-dir universe-shards \
            --out dashboard/data/universe-candidates.json \
            --daily dashboard/data/daily.json
          python dashboard/scripts/build_static_site.py --out .
      - name: Publish merged candidate pool
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/universe-candidates.json dashboard/data/daily.json data/universe-candidates.json data/daily.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh full-universe candidates $(TZ=Asia/Shanghai date '+%F %H:%M')"
          git push
